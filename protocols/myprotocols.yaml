submitted_protocol:
  description: automatically generated
  parameters:
    electronic-temperature: 25 meV
    max-scf-iterations: '100'
    mesh-cutoff: 350 Ry
    scf-dm-tolerance: 1e-05
    scf-mixer-history: '7'
    scf-mixer-weight: '0.1'
    solution-method: diagon
    write-forces: 'True'
    xc-authors: PBE
    xc-functional: GGA
  spin_additions:
    SpinPolarized: 'False'
  relax_additions:
    md-max-cg-displ: 0.120 Ang
    md-max-force-tol: 0.04 eV/ang
    md-max-stress-tol: 0.1 GPa
    md-num-cg-steps: '100'
    md-type-of-run: CG
    md-use-save-xv: .true.
    write-md-xmol: .true.
  basis:
    pao-basis-size: DZP
    pao-energy-shift: 50 meV
  pseudo_family: psf_family
  kpoints:
    distance: 0.1
    offset:
    - 0.0
    - 0.0
    - 0.0
